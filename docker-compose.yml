# Socle commun (front + Tomcat). La base est ajoutée par dockerServer/db/<base>.yaml,
# choisi via COMPOSE_FILE dans le .env écrit par : docker compose run --rm setup
name: dockertp

include:
  - dockerServer/docker-compose.yml

services:
  setup:
    build: ./setup
    profiles: [setup]
    stdin_open: true
    tty: true # documente un service interactif, fourni un terminal
    init: true # permet d'eviter que node soit le PID 1 du conteneur
    volumes:
      - .:/project #cree un lien entre le directory du projet en local et un directory du container
                  # permet de lire le .env qui sera cree lors du setup

  front:
    build:
      context: ./dockerJs
    deploy:
      resources:
        limits:
          memory: 64M 
    ports:
      - "${FRONT_PORT:-80}:80" #variable en cas de conflit de port, sinon 80 par défaut
    depends_on:
      tomcat:
        condition: service_healthy # verifie que le service tomcat est bien démarré avant de lancer le front
    restart: unless-stopped