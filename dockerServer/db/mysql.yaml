# MySQL. Chemins relatifs à la racine du projet.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    volumes:
      - mysqldata:/var/lib/mysql
      - ./dockerServer/db/init/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./dockerServer/secrets/db-password:/run/secrets/db-password:ro
      - ./dockerServer/secrets/db-root-password:/run/secrets/db-root-password:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  tomcat:
    build:
      args:
        DB_DRIVER_JAR_URL: https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.1.0/mysql-connector-j-9.1.0.jar
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USER}
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata: