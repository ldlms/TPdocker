services:

  webapp:
    image: 'local/dockerjava-war'
    build:
      context: '../dockerJava'
    deploy:
      replicas: 0 # aucun conteneur : le service sert uniquement à construire l'image qui contient le .war
  tomcat:
    image: 'local/dockertp-tomcat'
    build:
      context: '.'
      additional_contexts: # permet au service d'accéder au resultat du build du service webapp pour copier le .war dans le tomcat
        webapp: 'service:webapp'
    environment:
      DB_RESOURCE_NAME: 'jdbc/helloworld'
      DB_PASSWORD_FILE: 'secrets/db-password'
      MANAGER_PASSWORD_FILE: 'secrets/manager-password'
      JAVA_OPTS: '-XX:MaxRAMPercentage=75' #voir doc 
    deploy:
      replicas: ${NB_REPLICAS:-1} # par défaut 1 replica, sinon valeur du .env
      resources:
          limits:
            cpus: '1.0'
            memory: 768M
    volumes:
      - './secrets/manager-password:/usr/local/tomcat/secrets/manager-password:ro'
      - './secrets/db-password:/usr/local/tomcat/secrets/db-password:ro'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/hello"]
      interval: 5s
      start_period: 60s
      retries: 5
  